<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.16</title>
</head>
<body style="text-align: center;">
    <header>
        <img src="images.png" alt="Logo" width="300" height="100">
    </header>
    <main>
        <form>
            <br>
            <div>
                <label for="ed">Email Addres</label>
                <input type="email" id="ed" required>
            </div>
            <br>
            <div>
                <label for="dob">Date of Booking</label>
                <input type="datetime-local" id="dob">
            </div>
            <br>
            <div>
                <label for="nop">Number of people</label>
                <input type="number" id="nop" min="1" max="8">
            </div>
            <br>
            <div>
                <input type="checkbox" id="i">
                <label for="i">I agree to the cancellation policy</label>
            </div>
            <br>
            <button type="submit">Book Now</button>
        </form>
    </main>
</body>
</html>
